  function renderModal() {
    const layer = $('#layer');
    const t = trips.find(x => x.id === open);
    if (!t) { layer.innerHTML = ''; if (pageShown) { pageShown = false; render(); } return; }
    const d = role === 'carrier' ? carrierModal(t) : logistModal(t);
    const keep = document.activeElement && document.activeElement.id === 'bidsum' ? $('#bidsum').value : null;
    if (d.wide) { layer.innerHTML = ''; renderPage(d); if (keep != null) { const i = $('#bidsum'); i.value = keep; i.focus(); } return; }
    layer.innerHTML = `<div class="scrim" data-close><div class="modal ${d.small ? 'modal--sm' : ''} ${d.wide ? 'modal--wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="dtitle">
      <div class="modal__head"><h2 id="dtitle">${d.title}</h2>${d.sub}<button class="x" type="button" data-close aria-label="Закрыть"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"/></svg></button></div>
      <div class="modal__body">${d.body}</div>${d.foot ? `<div class="modal__foot">${d.foot}</div>` : ''}</div></div>`;
    if (keep != null) { const i = $('#bidsum'); i.value = keep; i.focus(); } else if (d.small && $('#bidsum')) $('#bidsum').focus();
  }

  // ---------- Actions ----------
  function placeBid(t, sum) {
    const box = $('#moneybox'), hint = $('#bidhint');
    const fail = m => { box.classList.add('bad'); hint.classList.add('bad'); hint.textContent = m; $('#bidsum').focus(); };
    if (!sum) return fail('Введите сумму ставки.');
    if (sum >= price(t)) return fail(`Ставка должна быть ниже текущей: меньше ${fmt(price(t))}.`);
    if (sum < t.floor) return fail(`Ставка ниже допустимой для этого рейса. Предложите не меньше ${fmt(t.floor)}.`);
    t.bids.push({ who: ME, sum }); t.current = sum; t.leader = ME;
    toast(`Ставка ${fmt(sum)} принята. Вы лидируете.`);
    if (quick) { open = null; quick = false; }
    render();
    // A rival answers on some trips, so the "outbid" state is easy to see.
    if (t.id % 2 === 0 && sum - 1000 >= t.floor) setTimeout(() => {
      if (t.state !== 'auction' || t.leader !== ME) return;
      const r = RIVALS[t.id % RIVALS.length], s = sum - 1000;
      t.bids.push({ who: r, sum: s }); t.current = s; t.leader = r;
      toast(`Ставку по заявке № ${t.id} перебили: ${fmt(s)}.`);
      render();
    }, 6000);
  }

  const t0 = () => trips.find(x => x.id === open);
  document.addEventListener('click', e => {
    if (e.target.classList && e.target.classList.contains('scrim')) { open = null; quick = false; step = 0; draft = {}; return renderModal(); }
    if (!e.target.closest('.prof') && $('#pmenu')) { $('#pmenu').hidden = true; $('#profile').setAttribute('aria-expanded', 'false'); }
    const el = e.target.closest('button, tr[data-open], article[data-open], article[data-ent], li[data-ent-trip]'); if (!el) return;
    if (el.dataset.screen) { screen = el.dataset.screen; authErr = ''; return render(); }
    if (el.id === 'orgok' || el.id === 'skip') { screen = 'app'; authErr = ''; return render(); }
    if (el.id === 'profile') { const m = $('#pmenu'); m.hidden = !m.hidden; el.setAttribute('aria-expanded', !m.hidden); return; }
    if (!el.closest('.prof')) { $('#pmenu').hidden = true; $('#profile').setAttribute('aria-expanded', 'false'); }
    if (el.id === 'role-carrier' || el.id === 'role-logist') { $('#pmenu').hidden = true; $('#profile').setAttribute('aria-expanded', 'false'); role = el.id === 'role-carrier' ? 'carrier' : 'logist'; view = role === 'carrier' ? 'auction' : 'requests'; open = null; step = 0; return render(); }
    if (el.dataset.nav) { view = el.dataset.nav; open = null; ent = null; return render(); }
    if (el.dataset.ent) { ent = el.dataset.ent; render(); return scrollTo(0, 0); }
    if (el.id === 'entback') { ent = null; return render(); }
    if (el.dataset.entTrip) { open = +el.dataset.entTrip; step = 0; return renderModal(); }
    if (el.dataset.view) { view = el.dataset.view; return render(); }
    if (el.dataset.av) { aview = el.dataset.av; return render(); }
    if (el.id === 'unsel') { sel = null; return render(); }
    if (el.dataset.lf) { lfilter = el.dataset.lf; return render(); }
    if (el.id === 'ftoggle') { showFilters = !showFilters; return render(); }
    if (el.dataset.fk) { const k = el.dataset.fk, v = el.dataset.fv; if (Array.isArray(filter[k])) filter[k] = filter[k].includes(v) ? filter[k].filter(x => x !== v) : [...filter[k], v]; else filter[k] = filter[k] === v ? '' : v; return render(); }
    if (el.dataset.frm) { const [k, v] = el.dataset.frm.split('|'); if (Array.isArray(filter[k])) filter[k] = filter[k].filter(x => x !== v); else filter[k] = ''; return render(); }
    if (el.id === 'freset') { filter = F0(); return render(); }
    if (el.id === 'savesearch') { const name = fnameDraft.trim() || fauto(filter); saved.push({ name, f: fclone(filter) }); fnameDraft = ''; showFilters = false; toast(`Поиск «${name}» сохранён. Он во вкладке «Сохраненный поиск».`); return render(); }
    if (el.dataset.usesaved) { const x = saved[+el.dataset.usesaved]; filter = fclone(x.f); view = 'auction'; showFilters = false; toast(`Применён поиск «${x.name}».`); return render(); }
    if (el.dataset.delsaved) { const x = saved.splice(+el.dataset.delsaved, 1)[0]; toast(`Поиск «${x.name}» удалён.`); return render(); }
    if (el.hasAttribute('data-close')) { open = null; quick = false; step = 0; draft = {}; return renderModal(); }
    if (el.dataset.confirm) { open = +el.dataset.confirm; step = 1; draft = {}; return renderModal(); }
    if (el.id === 'minus' && t0()) { const i = $('#bidsum'); i.value = (price(t0()) - 1000).toLocaleString('ru-RU'); i.focus(); return; }
    if (el.id === 'mbid') { const f = $('#bidsum'); if (f) { f.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' }); f.focus({ preventScroll: true }); } return; }
    if (el.dataset.bid) { open = +el.dataset.bid; quick = true; step = 0; return renderModal(); }
    if (el.dataset.open) { open = +el.dataset.open; quick = false; step = 0; draft = {}; return renderModal(); }
    const t = trips.find(x => x.id === open);
    if (el.id === 'finish') { $('#pmenu').hidden = true;
      const won = trips.filter(x => x.state === 'auction' && x.leader === ME);
      won.forEach(x => { x.state = 'won'; x.ends = now() - 1000; });
      toast(won.length ? `Торги завершены. Выиграно рейсов: ${won.length}. Они в «Моих ставках».` : 'Вы пока нигде не лидируете. Сделайте ставку в аукционе.');
      if (won.length) view = 'mybids';
      return render();
    }
        if (el.id === 'startconfirm') { step = 1; return renderModal(); }
    if (el.dataset.step) {
      if (step === 3) { draft.date = $('#cdate').value; draft.time = $('#ctime').value; }
      step = +el.dataset.step; return renderModal();
    }
    if (el.id === 'doconfirm' && t) {
      const d = drivers[draft.driver], x = trucks[draft.truck];
      t.confirm = { driver: d.name, truck: `${x.name} · ${x.plate}`, date: $('#cdate').value || t.load, time: $('#ctime').value };
      t.state = 'confirmed'; step = 0; draft = {};
      toast(`Заявка № ${t.id} подтверждена. Логист получил данные водителя и машины.`);
      return render();
    }
    if (el.dataset.advance && t) {
      t.state = el.dataset.advance;
      toast({ road: 'Статус «Доставка». Логист видит, что машина в пути.', docs: 'Статус «Ожидает документов».', done: `Заявка № ${t.id} завершена.` }[t.state]);
      return render();
    }
    if (el.id === 'cancel' && t) { t.state = 'cancel'; toast(`Заявка № ${t.id} отменена.`); return render(); }
  });
  document.addEventListener('change', e => {
    if (e.target.name === 'drv') { draft.driver = +e.target.value; renderModal(); }
    if (e.target.name === 'trk') { draft.truck = +e.target.value; renderModal(); }
    if (e.target.dataset.fsel) { filter[e.target.dataset.fsel] = e.target.value; render(); }
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'fname') fnameDraft = e.target.value;
    if (e.target.id === 'bidsum') { $('#moneybox').classList.remove('bad'); $('#bidhint').classList.remove('bad'); }
  });
  document.addEventListener('submit', e => {
    const f = e.target.id;
    if (['loginform', 'forgotform', 'resetform', 'errform'].includes(f)) {
      e.preventDefault();
      const v = id => ($('#' + id).value || '').trim();
      if (f === 'loginform') { authErr = ''; screen = 'app'; }
      if (f === 'forgotform') { if (!/^\S+@\S+\.\S+$/.test(v('mail'))) authErr = 'Проверьте адрес почты.'; else { authErr = ''; screen = 'reset'; } }
      if (f === 'resetform') { if (v('p1').length < 6) authErr = 'Пароль должен быть не короче 6 символов.'; else if (v('p1') !== v('p2')) authErr = 'Пароли не совпадают.'; else { authErr = ''; screen = 'login'; toast('Пароль сохранён. Войдите с новым паролем.'); } }
      if (f === 'errform') { if (!v('errtext')) authErr = 'Опишите, какие данные неверны.'; else { authErr = ''; screen = 'sent'; } }
      return render();
    }
    if (f !== 'bidform') return; e.preventDefault();
    placeBid(trips.find(x => x.id === open), +$('#bidsum').value.replace(/\D/g, ''));
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('#pmenu').hidden) { $('#pmenu').hidden = true; $('#profile').focus(); }
    if (e.key === 'Escape' && open) { open = null; step = 0; draft = {}; renderModal(); }
    if (e.key === 'Enter' && e.target.matches('article[data-ent]')) { ent = e.target.dataset.ent; render(); }
    if (e.key === 'Enter' && e.target.matches('tr[data-open], article[data-open]')) { open = +e.target.dataset.open; step = 0; renderModal(); }
  });

  // Live countdowns without re-rendering the page.
  setInterval(() => {
    document.querySelectorAll('.timer[data-ends]').forEach(el => {
      const tmp = document.createElement('div'); tmp.innerHTML = timer({ ends: +el.dataset.ends }); el.replaceWith(tmp.firstChild);
    });
  }, 1000);

  render();
})();
</script>
<script>
/* 11.11 alen: no hanging prepositions or conjunctions at the end of a line. Every rendered text node gets a no-break space after short words. */
(function () {
  var RX = /(^|[\s(«"])(а|в|во|и|к|ко|о|об|обо|с|со|у|на|по|за|из|до|от|для|без|при|про|под|над|или|но|не|ни|что|как|чтобы|через|перед|если|то|ли|бы|это) /gi;
  var SKIP = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, INPUT: 1 };
  function fix(t) { var v = t.nodeValue, n = v.replace(RX, '$1$2 ').replace(RX, '$1$2 ').replace(/ — /g, ' — '); if (n !== v) t.nodeValue = n; }
  function walk(root) {
    if (root.nodeType === 3) { if (!SKIP[root.parentNode && root.parentNode.nodeName]) fix(root); return; }
    if (root.nodeType !== 1 || SKIP[root.nodeName]) return;
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), n;
    while ((n = w.nextNode())) if (!SKIP[n.parentNode.nodeName]) fix(n);
  }
  walk(document.body);
  new MutationObserver(function (ms) { ms.forEach(function (m) { if (m.type === 'characterData') walk(m.target); else m.addedNodes.forEach(walk); }); })
    .observe(document.body, { childList: true, subtree: true, characterData: true });
})();
</script>
